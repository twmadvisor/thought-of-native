name: Import recovered Thought Of source

on:
  push:
    paths:
      - 'thought-of-native-v1*.zip'
      - '.github/workflows/import-recovered-source.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find and unpack recovered mobile project
        shell: bash
        run: |
          set -euo pipefail
          zip_file="$(find . -maxdepth 1 -type f -name 'thought-of-native-v1*.zip' -print -quit)"
          if [ -z "$zip_file" ]; then
            echo "No recovered ZIP found, nothing to import."
            exit 0
          fi
          unzip -o "$zip_file" -d .
          rm "$zip_file"

      - name: Align current Expo SDK 57 patch
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          python3 - <<'PY'
          import json
          path = 'package.json'
          with open(path, encoding='utf-8') as f:
              package = json.load(f)
          package['dependencies']['expo'] = '~57.0.17'
          package['dependencies']['@supabase/supabase-js'] = '2.57.4'
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(package, f, indent=2)
              f.write('\n')
          PY

      - name: Commit imported source
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Import recovered Thought Of native app source"
          git push
