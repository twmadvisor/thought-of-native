name: Verify Expo iOS prebuild

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ios-prebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck app
        run: npm run typecheck

      - name: Verify Expo config
        run: npx expo config --type public

      - name: Bundle production iOS JavaScript
        env:
          NODE_ENV: production
        run: npx expo export --platform ios --output-dir dist-test

      - name: Generate iOS native project
        env:
          EXPO_NO_GIT_STATUS: '1'
        run: npx expo prebuild --platform ios --clean --no-install
